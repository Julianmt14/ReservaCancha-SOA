server:
  port: 8080

spring:
  application:
    name: reservacancha
  datasource:
    # Por defecto H2 en archivo (carpeta datos/): los usuarios se conservan al reiniciar.
    # Para Postgres se cambia con SPRING_DATASOURCE_URL y docker-compose.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./datos/reservacancha}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    # Las consultas terminan en la capa de servicio; no se mantienen abiertas durante la serializacion JSON
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:cGFyYS1kZXYtbXV5LXNlY3JldG8tbXV5LWxhcmdvLXJlc2VydmFjYW5jaGEtY29sb21iaWE=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Proveedor 1: canchas, horarios y reglas (servicios/servicio-escenarios, puerto 8081).
  servicio-escenarios:
    url: ${SERVICIO_ESCENARIOS_URL:http://localhost:8081}
    timeout-ms: ${SERVICIO_ESCENARIOS_TIMEOUT_MS:5000}
  # Proveedor 2: reservas y horarios ocupados (servicios/servicio-reservas, puerto 8082).
  servicio-reservas:
    url: ${SERVICIO_RESERVAS_URL:http://localhost:8082}
    api-key: ${RESERVAS_API_KEY:clave-dev-portal-reservacancha}
    timeout-ms: ${SERVICIO_RESERVAS_TIMEOUT_MS:5000}
  # Los pagos son de servicio-pagos (servicios/servicio-pagos, puerto 8085); aquí solo se le llama.
  servicio-pagos:
    url: ${SERVICIO_PAGOS_URL:http://localhost:8085}
    api-key: ${PAGOS_API_KEY:clave-dev-portal-reservacancha}
    timeout-ms: ${SERVICIO_PAGOS_TIMEOUT_MS:15000}
  # En Render: al arrancar, despierta a los proveedores (ver DespertarProveedores)
  despertar-proveedores: ${DESPERTAR_PROVEEDORES:false}
  wompi:
    # El webhook de Wompi llega aquí: se valida este secreto y se reenvía a servicio-pagos.
    events-secret: ${WOMPI_EVENTS_SECRET:test_events_XXXX}
