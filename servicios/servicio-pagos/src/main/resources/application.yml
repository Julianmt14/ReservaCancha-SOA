server:
  port: 8085

spring:
  application:
    name: servicio-pagos
  datasource:
    # Base de datos propia del servicio: ReservaCancha no la toca, solo pide los pagos por HTTP.
    url: ${PAGOS_DATASOURCE_URL:jdbc:h2:mem:serviciopagos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${PAGOS_DATASOURCE_USERNAME:sa}
    password: ${PAGOS_DATASOURCE_PASSWORD:}
    driver-class-name: ${PAGOS_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

app:
  # Clave que debe mandar la aplicación consumidora en X-Api-Key (la misma del backend de ReservaCancha)
  api-key: ${PAGOS_API_KEY:clave-dev-portal-reservacancha}
  wompi:
    public-key: ${WOMPI_PUBLIC_KEY:pub_test_XXXX}
    integrity-secret: ${WOMPI_INTEGRITY_SECRET:test_integrity_XXXX}
    base-url: ${WOMPI_BASE_URL:https://sandbox.wompi.co/v1}
    currency: COP
